<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Download audio and video from YouTube — simple, fast, mobile-friendly.">
    <meta name="theme-color" content="#080810">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>YT Downloader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">

        <header class="app-header">
            <h1 class="app-title">YT Downloader</h1>
            <p class="app-subtitle">Audio and video, made simple.</p>
        </header>

        <main class="app-main" id="app-main">

            <!-- ── URL Input ───────────────────────────────────────────── -->
            <section class="input-section">
                <label class="field-label" for="url-input">Video URL</label>
                <div class="input-row">
                    <input
                        type="url"
                        id="url-input"
                        class="url-input"
                        placeholder="Paste a YouTube link here"
                        inputmode="url"
                        autocomplete="off"
                        autocorrect="off"
                        autocapitalize="none"
                        spellcheck="false"
                        aria-describedby="url-error"
                    >
                    <button class="paste-btn" id="paste-btn" type="button" aria-label="Paste URL from clipboard">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
                            <rect x="8" y="2" width="8" height="4" rx="1"/>
                        </svg>
                        Paste
                    </button>
                </div>
                <p class="field-error" id="url-error" role="alert" aria-live="polite"></p>
            </section>

            <!-- ── Format Selector ─────────────────────────────────────── -->
            <section class="format-section">
                <p class="field-label">Format</p>
                <div class="format-group" role="group" aria-label="Download format">
                    <button
                        class="format-btn active"
                        id="btn-mp3"
                        data-format="mp3"
                        type="button"
                        aria-pressed="true"
                    >
                        <span class="format-icon" aria-hidden="true">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 18V5l12-2v13"/>
                                <circle cx="6" cy="18" r="3"/>
                                <circle cx="18" cy="16" r="3"/>
                            </svg>
                        </span>
                        <span class="format-name">MP3</span>
                        <span class="format-desc">Audio only</span>
                    </button>
                    <button
                        class="format-btn"
                        id="btn-mp4"
                        data-format="mp4"
                        type="button"
                        aria-pressed="false"
                    >
                        <span class="format-icon" aria-hidden="true">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="23 7 16 12 23 17 23 7"/>
                                <rect x="1" y="5" width="15" height="14" rx="2"/>
                            </svg>
                        </span>
                        <span class="format-name">MP4</span>
                        <span class="format-desc">Video + audio</span>
                    </button>
                </div>
            </section>

            <!-- ── Quality Selector (MP4 only) ────────────────────────── -->
            <section class="quality-section hidden" id="quality-section" aria-hidden="true">
                <p class="field-label">Quality</p>
                <div class="quality-group" role="group" aria-label="Video quality">
                    <button class="quality-btn active" data-quality="auto"  type="button" aria-pressed="true">Auto</button>
                    <button class="quality-btn"        data-quality="360p"  type="button" aria-pressed="false">360p</button>
                    <button class="quality-btn"        data-quality="720p"  type="button" aria-pressed="false">720p</button>
                    <button class="quality-btn"        data-quality="1080p" type="button" aria-pressed="false">1080p</button>
                </div>
                <p class="quality-note">Quality falls back to best available if the selected tier doesn't exist.</p>
            </section>

            <!-- ── Primary Download Button ─────────────────────────────── -->
            <button class="download-btn" id="download-btn" type="button">
                <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                <span class="btn-label">Download</span>
                <span class="btn-spinner hidden" aria-hidden="true"></span>
            </button>

            <!-- ── Status / Progress ───────────────────────────────────── -->
            <div class="status-card hidden" id="status-card" role="status" aria-live="polite" aria-atomic="true">
                <span class="status-spinner" aria-hidden="true"></span>
                <span class="status-text" id="status-text">Starting…</span>
            </div>

            <!-- ── Error ───────────────────────────────────────────────── -->
            <div class="error-card hidden" id="error-card" role="alert">
                <svg class="error-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                <span class="error-text" id="error-text"></span>
            </div>

            <!-- ── Save File (shown when ready) ───────────────────────── -->
            <a class="save-btn hidden" id="save-btn" role="button" tabindex="0">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                Tap to save file
            </a>

            <!-- ── Start Over ──────────────────────────────────────────── -->
            <button class="reset-btn hidden" id="reset-btn" type="button">
                ↩ Start over
            </button>

        </main>

        <footer class="app-footer">
            <p>Only download content you own or are authorized to download.</p>
        </footer>

    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
